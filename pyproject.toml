[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verl-self-summarization-agent"
version = "0.1.0"
description = "rLLM/verl self-summarization agent for BrowseComp-Plus"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "PyYAML>=6.0.2",
  "datasets>=4.0.0",
  "numpy>=1.26,<2.0",
  "packaging>=25.0,<26.0",
  "transformers>=4.57.0",
  "torch==2.8.0",
  "torchvision",
  "openai>=1.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0",
]
rllm = [
  "verl==0.6.1",
  "rllm @ git+https://github.com/rllm-org/rllm.git",
  "rllm-model-gateway>=0.1.0",
  "simple-term-menu>=1.6",
  "tinker>=0.18.2",
  "tinker-cookbook @ git+https://github.com/thinking-machines-lab/tinker-cookbook.git",
]
retrieval = [
  "faiss-cpu>=1.13.2",
  "pyserini>=1.2.0",
  "qwen-omni-utils>=0.0.8",
  "tevatron",
]

[tool.uv]
default-groups = ["rllm", "retrieval"]

[project.optional-dependencies]
retrieval = [
  "faiss-cpu>=1.13.2",
  "pyserini>=0.22.0",
  "qwen-omni-utils>=0.0.8",
  "tevatron",
]
serving = [
  "vllm==0.11.0",
]
rllm = [
  "verl==0.6.1",
  "rllm @ git+https://github.com/rllm-org/rllm.git",
  "rllm-model-gateway>=0.1.0",
  "simple-term-menu>=1.6",
  "tinker>=0.18.2",
  "tinker-cookbook @ git+https://github.com/thinking-machines-lab/tinker-cookbook.git",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
tevatron = { git = "https://github.com/texttron/tevatron.git", rev = "main" }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
